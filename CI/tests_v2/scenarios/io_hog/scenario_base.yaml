# Base I/O hog scenario (hog_scenarios). Tests load this and patch namespace, node-selector,
# number-of-nodes, duration, etc. The I/O hog targets nodes (not workloads): Krkn deploys a
# short-lived hog pod (name prefix "io-hog-") on each selected node, runs `stress-ng` disk I/O
# for the configured duration, then deletes the pod. Values here are tuned for functional
# testing (light, short) rather than disk-pressure benchmarking; in particular io-write-bytes
# is a small fixed size and io-target-pod-volume uses the krkn-lib default hostPath /tmp
# (kubelet-writable on kind) instead of the production /root.
duration: 20
workers: 1
hog-type: io
image: quay.io/krkn-chaos/krkn-hog
namespace: default
io-block-size: 1m
io-write-bytes: 10m
io-target-pod-folder: /hog-data
io-target-pod-volume:
  name: node-volume
  hostPath:
    path: /tmp
node-selector: "node-role.kubernetes.io/worker="
number-of-nodes: 1
taints: []
