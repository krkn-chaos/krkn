apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: krkn-vmi-pvc-test-claim
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: krkn-vmi-pvc-test-pod
  labels:
    app: krkn-vmi-pvc-fill-target
spec:
  containers:
    - name: app
      image: ubuntu:24.04
      command: ["bash", "-c", "while true; do sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: krkn-vmi-pvc-test-claim
