# Base pod_network_filter scenario (list). Tests patch namespace and per-case overrides.
- id: pod_network_filter
  image: "quay.io/krkn-chaos/krkn-network-chaos:latest"
  wait_duration: 1
  test_duration: 10
  label_selector: ""
  service_account: ""
  taints: []
  namespace: default
  instance_count: 1
  execution: parallel
  ingress: false
  egress: true
  target: ""
  interfaces: []
  protocols:
    - tcp
  ports:
    - 80
