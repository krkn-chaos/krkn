apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.29.1-alpine
        ports: [{name: http, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector: {app: nginx}
  ports: [{name: http-web-svc, port: 80, targetPort: 8080}]
