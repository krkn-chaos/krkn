apiVersion: apps/v1
kind: Deployment
metadata:
  name: krkn-pod-error-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krkn-pod-error-target
  template:
    metadata:
      labels:
        app: krkn-pod-error-target
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        # Delay Ready so a short krkn_pod_recovery_time cannot succeed on a fast cluster.
        # Happy-path tests use recovery_time=120, which is well above this delay.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 2
          failureThreshold: 1
