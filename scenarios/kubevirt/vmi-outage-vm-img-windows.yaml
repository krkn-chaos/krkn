scenarios:
  - name: "vmi outage guest ping mttr"
    scenario: vmi_outage
    parameters:
      vm_name: vm-img--windows
      namespace: ieng--vm-img
      timeout: 600
      wait_for_guest_ping: true
      guest_ping_timeout: 300
      guest_ping_interval: 2
      guest_ping_method: icmp
      guest_ping_settle_seconds: 5
      guest_ping_pod: krkn-guest-ping-diagnosis
