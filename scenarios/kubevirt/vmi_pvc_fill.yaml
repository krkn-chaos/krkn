vmi_pvc_fill_scenario:
  vmi_name: krkn-vmi-block
  namespace: default
  pvc_name: krkn-vmi-block-pvc
  # Guest OS path. This is different from the virt-launcher Pod device path.
  device_path: /dev/vdb
  filesystem: ext4
  # Formatting is destructive. Use only with a disposable data disk.
  format_device: true
  fill_percentage: 50
  duration: 20
  username: cirros
  identity_file: "/Users/prubenda/.ssh/krkn-cirros"
  pod_name: ""
