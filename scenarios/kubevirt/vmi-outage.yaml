scenarios:
  - name: "vmi outage test"
    scenario: vmi_outage
    parameters:
      vm_name: <vm-name>        # optional if label_selector is set
      label_selector: ""        # optional; if set, vm_name is not required
      namespace: <namespace>
      timeout: 60
      # Optional: MTTR from VMI Running → first guest ping/TCP via helper pod
      wait_for_guest_ping: false
      guest_ping_timeout: 300
      guest_ping_interval: 2
      # tcp is preferred on OpenShift restricted-v2 (no NET_RAW).
      # icmp needs NET_RAW and may fail under restricted SCC.
      guest_ping_method: icmp   # icmp | tcp
      guest_ping_port: 22       # used when guest_ping_method=tcp
      guest_ping_settle_seconds: 5
      # guest_ping_namespace:   # defaults to the scenario namespace
      # Reuse a pre-created helper (recommended for TCP):
      #   oc apply -f scenarios/kubevirt/guest-ping-diagnosis-pod.yaml -n <ns>
      # guest_ping_pod: krkn-guest-ping-diagnosis

