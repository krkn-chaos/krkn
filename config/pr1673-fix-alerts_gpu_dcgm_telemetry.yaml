# DRAFT - Prometheus alert profile for Scenario C (GPU telemetry blackout).
# UNTESTED END-TO-END: not run against any Prometheus server in a cluster.
# Untested on real GPU. (The PromQL below was checked against a local
# Prometheus 3.5.0 with synthetic data only, see QODO-FIX.md.)
#
# Use with (run_during MUST be "during", see "Why during" below):
#   performance_monitoring:
#     enable_alerts: True
#     alert_profile: config/alerts_gpu_dcgm_telemetry.yaml
#     run_during: during
#   resiliency:
#     resiliency_file: config/resiliency_gpu_dcgm_telemetry.yaml
#   tunings:
#     wait_duration: 60   # >= 2x the exporter scrape interval, so the
#                         # end-of-run checks do not fail just because the
#                         # first post-restart scrape has not happened yet
#
# Why during: krkn evaluates "during" checks once, after the scenarios, as a
# range query over the krkn run window [run start, run end]
# (run_kraken.py -> PrometheusHealthCheckPlugin.run_once). Inside a range
# query, "@ start()" and "@ end()" pin a selector to the window edges, which
# is what bounds checks 1 and 3 to this run. In a "post" check (an instant
# query) start() == end() == now: check 1 would always report, and check 3
# would never fail. Run Scenario C on its own in a krkn run, so the run
# window is the blackout window.
#
# Why resiliency_file: without it krkn re-uses this alert profile as its
# resiliency SLO list (run_kraken.py, resiliency_file defaults to
# alert_profile), and check 1 (placeholder alert) would lower the resiliency
# score of every run. The resiliency file holds only the recovery SLOs.
#
# Needs the PromQL "@" modifier (on by default since Prometheus 2.33).
# UNVERIFIED for Thanos Querier / OpenShift user-workload monitoring.
#
# krkn semantics (krkn/prometheus/collector.py::slo_passed): an empty result
# passes; any sample > 0 at any step of the range fails. Every expression
# below returns a value only in the bad case.
#
# UNVERIFIED names:
#   DCGM_FI_DEV_GPU_UTIL   - default dcgm-exporter field; confirm it is enabled
#                            in your exporter's metrics CSV.
#   UUID                   - per-GPU label dcgm-exporter is assumed to set on
#                            every metric. If it is missing, check 3 degrades
#                            to "all GPU series vanished", which check 2 also
#                            catches.
#   DCGMExporterDown       - PLACEHOLDER. There is no confirmed default alert with
#                            this name. Replace with the alert your cluster actually
#                            uses for "GPU telemetry missing".
#
# Known limits (not fixable in an alert profile; krkn profiles have no
# templating for the killed pod, node or instance):
#   - Checks cannot be scoped to the specific exporter pod krkn deleted. Check
#     3 compares the set of GPUs reporting at run start with the set at run end,
#     which catches one missing exporter even when other exporters still report
#     (the case a global absent() masks). It is NOT a per-pod check, and it
#     reports a false failure if a GPU node is legitimately removed during the
#     run.
#   - Check 2 (global absent) is only a strong signal on a single-exporter /
#     single-GPU-node cluster, which is the validation context it was written
#     for. On a multi-node cluster rely on check 3.

# Check 1: the expected "telemetry missing" alert fired at some point DURING
# THIS RUN. Returns 1 if it never fired in the 6h before run end, or the time
# of its last firing sample if that was before run start (an earlier alert no
# longer counts). Lookback is capped at 6h: a run longer than that can report
# a false miss. Subquery resolution 15s: a firing shorter than about one rule
# evaluation interval can be missed.
# Default severity is warning (reported, does not fail the run): one pod kill
# usually heals faster than the alert's `for:` duration, so the alert may
# correctly never fire. To verify your alerting properly, hold the blackout
# longer than `for:` plus one scrape interval (for example kill repeatedly or
# hold the exporter down for that long in a test cluster), then raise this
# check to severity error.
- expr: >-
    absent_over_time(ALERTS{alertname="DCGMExporterDown", alertstate="firing"}[6h] @ end())
    or
    max(max_over_time(timestamp(ALERTS{alertname="DCGMExporterDown", alertstate="firing"})[6h:15s] @ end()))
    < scalar(max_over_time(timestamp(vector(1))[15s:15s] @ start()))
  description: Expected GPU telemetry alert DCGMExporterDown did not fire during this krkn run (DCGM exporter blackout)
  severity: warning

# Check 2: GPU metrics are flowing at the end of the run, after recovery.
# Global: on a multi-exporter cluster a surviving exporter keeps this passing
# even if the killed one never came back; check 3 covers that case.
- expr: absent(DCGM_FI_DEV_GPU_UTIL @ end())
  description: DCGM_FI_DEV_GPU_UTIL is absent at the end of the run; GPU telemetry did not recover
  severity: error

# Check 3: every GPU that reported at run start reports again at run end.
# Returns one sample per GPU (by UUID) whose metrics did not come back.
- expr: >-
    count by (UUID) (DCGM_FI_DEV_GPU_UTIL @ start())
    unless
    count by (UUID) (DCGM_FI_DEV_GPU_UTIL @ end())
  description: Some GPUs that reported DCGM_FI_DEV_GPU_UTIL at run start no longer report it at run end; their DCGM exporter did not recover
  severity: error
