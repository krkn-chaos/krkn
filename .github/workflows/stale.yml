name: Manage Stale Issues and Pull Requests

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    uses: krkn-chaos/actions/.github/workflows/stale-PRs-and-issues.yml@01a376af9315db7b740727e1f2f40a76ad118672 # main
    secrets: inherit
