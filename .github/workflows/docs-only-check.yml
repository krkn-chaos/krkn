name: Detect docs-only PR
on:
  workflow_call:
    outputs:
      docs_only:
        description: "Whether all changed pull request files are Markdown files."
        value: ${{ jobs.detect.outputs.docs_only }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect docs-only PR
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Detect changed file types
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setOutput('docs_only', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const docsOnly = files.length > 0 &&
              files.every((file) => file.filename.toLowerCase().endsWith('.md'));

            core.setOutput('docs_only', docsOnly ? 'true' : 'false');
            core.info(`docs_only=${docsOnly}; files=${files.map((file) => file.filename).join(', ')}`);
