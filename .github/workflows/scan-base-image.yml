name: Scan Krkn Base Image

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan latest base image and notify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: quay.io/krkn-chaos/krkn:latest
      GRYPE_VERSION: 0.121.3
    steps:
      - name: Check out pipeline scripts
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Install pinned Grype
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85 ;;
            aarch64|arm64) arch=arm64; sha=b7815598d48da78bfd16f5b98ef28e1bb09c03d34fc8c3e350f99b6ccb3c7cba ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          archive="grype_${GRYPE_VERSION}_linux_${arch}.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$sha  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" grype
          sudo install -m 0755 "$RUNNER_TEMP/grype" /usr/local/bin/grype
          grype version

      - name: Pull and scan latest image
        id: scan
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/grype-base-image.json"
          summary="$RUNNER_TEMP/grype-base-image-summary.json"
          docker pull "$IMAGE"
          grype "docker:$IMAGE" --output json --file "$report"
          python3 scripts/summarize_grype_report.py "$report" > "$summary"
          total=$(jq -r '.unique_vulnerability_ids' "$summary")
          fixable=$(jq -r '.unique_fixable_vulnerability_ids' "$summary")
          critical=$(jq -r '.counts_by_severity.Critical' "$summary")
          high=$(jq -r '.counts_by_severity.High' "$summary")
          medium=$(jq -r '.counts_by_severity.Medium' "$summary")
          low=$(jq -r '.counts_by_severity.Low' "$summary")
          negligible=$(jq -r '.counts_by_severity.Negligible' "$summary")
          unknown=$(jq -r '.counts_by_severity.Unknown' "$summary")
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "fixable=$fixable" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "medium=$medium" >> "$GITHUB_OUTPUT"
          echo "low=$low" >> "$GITHUB_OUTPUT"
          echo "negligible=$negligible" >> "$GITHUB_OUTPUT"
          echo "unknown=$unknown" >> "$GITHUB_OUTPUT"
          {
            echo '## Krkn base image Grype scan'
            echo
            echo "- Image: `$IMAGE`"
            echo "- Unique vulnerability IDs: $total; $fixable with published fixes"
            echo "- Critical: $critical; High: $high; Medium: $medium; Low: $low"
            echo "- Negligible: $negligible; Unknown: $unknown"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype-base-image-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grype-base-image.json
            ${{ runner.temp }}/grype-base-image-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify Slack with manual fix workflow link
        if: always()
        env:
          KRKN_IMAGE_SECURITY_REPORT_SLACK_WEBHOOK_URL: ${{ secrets.KRKN_IMAGE_SECURITY_REPORT_SLACK_WEBHOOK_URL }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.scan.outputs.total }}
          FIXABLE: ${{ steps.scan.outputs.fixable }}
          CRITICAL: ${{ steps.scan.outputs.critical }}
          HIGH: ${{ steps.scan.outputs.high }}
          MEDIUM: ${{ steps.scan.outputs.medium }}
          LOW: ${{ steps.scan.outputs.low }}
          NEGLIGIBLE: ${{ steps.scan.outputs.negligible }}
          UNKNOWN: ${{ steps.scan.outputs.unknown }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$KRKN_IMAGE_SECURITY_REPORT_SLACK_WEBHOOK_URL" ]]; then
            echo "KRKN_IMAGE_SECURITY_REPORT_SLACK_WEBHOOK_URL secret is required for the scheduled scan notification" >&2
            exit 1
          fi
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/patch-base-image.yml"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$SCAN_OUTCOME" == success ]]; then
            message="Krkn base image scan completed: *${FINDINGS:-0} unique vulnerability IDs*, ${FIXABLE:-0} with published fixes. Critical ${CRITICAL:-0}, High ${HIGH:-0}, Medium ${MEDIUM:-0}, Low ${LOW:-0}, Negligible ${NEGLIGIBLE:-0}, Unknown ${UNKNOWN:-0}. <${run_url}|View the scan report>. Launch remediation: <${workflow_url}|Patch Krkn Base Image>."
          else
            message="Krkn base image scan failed. Inspect <${run_url}|the workflow run> and launch remediation when ready: <${workflow_url}|Patch Krkn Base Image>."
          fi
          jq -n --arg text "$message" '{text: $text}' \
            | curl --fail --silent --show-error -X POST \
                -H 'Content-Type: application/json' \
                --data-binary @- "$KRKN_IMAGE_SECURITY_REPORT_SLACK_WEBHOOK_URL"
