name: Rebuild and sign krkn-hub images
description: Rebuild krkn-hub images using each Compose service's build context
inputs:
  QUAY_USER:
    description: Quay user
    required: true
  QUAY_TOKEN:
    description: Quay token
    required: true
  AUTOPUSH:
    description: Auto push token for Prow-Scripts
    required: true
  COSIGN_PRIVATE_KEY:
    description: cosign private key (PEM)
    required: true
  COSIGN_PASSWORD:
    description: password protecting the cosign private key
    required: true

runs:
  using: composite
  steps:
    - name: Checkout krkn-hub repo
      uses: actions/checkout@v3
      with:
        repository: krkn-chaos/krkn-hub
        path: krkn-hub

    - name: Free disk space
      shell: bash
      run: |
        sudo docker image prune -af
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login in quay
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ inputs.QUAY_USER }}
        password: ${{ inputs.QUAY_TOKEN }}

    - name: Add krknctl metadata to Dockerfiles
      shell: bash
      working-directory: ./krkn-hub
      run: bash build.sh

    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2

    - name: Build and sign krkn-hub images
      shell: bash
      working-directory: ./krkn-hub
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
      run: |
        set -euo pipefail

        compose_json="$RUNNER_TEMP/krkn-hub-compose.json"
        metadata_dir="$RUNNER_TEMP/krkn-hub-build-metadata"
        mkdir -p "$metadata_dir"
        docker compose config --format json > "$compose_json"
        mapfile -t scenarios < <(docker compose config --services)
        if ((${#scenarios[@]} == 0)); then
          echo "::error::docker compose returned no krkn-hub services"
          exit 1
        fi

        # Validate every service before pushing anything. Compose defines each
        # Dockerfile relative to that service's build context.
        for scenario in "${scenarios[@]}"; do
          image=$(jq -r --arg service "$scenario" '.services[$service].image // empty' "$compose_json")
          context=$(jq -r --arg service "$scenario" '.services[$service].build.context // empty' "$compose_json")
          dockerfile=$(jq -r --arg service "$scenario" '.services[$service].build.dockerfile // "Dockerfile"' "$compose_json")
          if [[ -z "$image" ]]; then
            echo "::error::No image configured for krkn-hub service $scenario"
            exit 1
          fi
          if [[ -z "$context" ]]; then
            echo "::error::No build context configured for krkn-hub service $scenario"
            exit 1
          fi
          if [[ "$dockerfile" = /* ]]; then
            dockerfile_path="$dockerfile"
          else
            dockerfile_path="${context%/}/${dockerfile#./}"
          fi
          if [[ ! -f "$dockerfile_path" ]]; then
            echo "::error::Dockerfile for $scenario not found: $dockerfile_path (context: $context)"
            exit 1
          fi
          echo "Validated $scenario (context: $context, dockerfile: $dockerfile_path)"
        done

        # Build amd64 in parallel, preserving the existing release behavior.
        pids=()
        for scenario in "${scenarios[@]}"; do
          image=$(jq -r --arg service "$scenario" '.services[$service].image // empty' "$compose_json")
          context=$(jq -r --arg service "$scenario" '.services[$service].build.context' "$compose_json")
          dockerfile=$(jq -r --arg service "$scenario" '.services[$service].build.dockerfile // "Dockerfile"' "$compose_json")
          if [[ "$dockerfile" = /* ]]; then
            dockerfile_path="$dockerfile"
          else
            dockerfile_path="${context%/}/${dockerfile#./}"
          fi
          echo "Building $scenario -> $image (context: $context, dockerfile: $dockerfile_path)"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$image" \
            --file "$dockerfile_path" \
            --provenance=false \
            --metadata-file "$metadata_dir/meta-${scenario}.json" \
            "$context" &
          pids+=("$!")
        done

        failed=0
        for pid in "${pids[@]}"; do
          if ! wait "$pid"; then
            failed=1
          fi
        done
        if [[ "$failed" -ne 0 ]]; then
          exit "$failed"
        fi

        cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
        for scenario in "${scenarios[@]}"; do
          image=$(jq -r --arg service "$scenario" '.services[$service].image // empty' "$compose_json")
          digest=$(jq -r '.["containerimage.digest"] // empty' "$metadata_dir/meta-${scenario}.json")
          if [[ -z "$image" || -z "$digest" ]]; then
            echo "::error::Missing image or build digest for $scenario; cannot sign"
            exit 1
          fi
          ref="${image%:*}@${digest}"
          echo "Signing $ref"
          cosign sign --yes --signing-config "${{ github.workspace }}/.github/cosign/signing-config.json" --key env://COSIGN_PRIVATE_KEY "$ref"
          cosign verify --insecure-ignore-tlog=true --key "$RUNNER_TEMP/cosign.pub" "$ref"
        done

        # Refresh multi-arch tags sequentially because arm64 is emulated via QEMU.
        for scenario in "${scenarios[@]}"; do
          image=$(jq -r --arg service "$scenario" '.services[$service].image // empty' "$compose_json")
          case "$image" in
            */krkn-hub:*) multiarch_image="${image/krkn-hub:/krkn-hub-multiarch:}" ;;
            *) echo "Skipping multi-arch build for $scenario ($image)"; continue ;;
          esac
          context=$(jq -r --arg service "$scenario" '.services[$service].build.context' "$compose_json")
          dockerfile=$(jq -r --arg service "$scenario" '.services[$service].build.dockerfile // "Dockerfile"' "$compose_json")
          if [[ "$dockerfile" = /* ]]; then
            dockerfile_path="$dockerfile"
          else
            dockerfile_path="${context%/}/${dockerfile#./}"
          fi
          echo "Building $scenario -> $multiarch_image (context: $context, dockerfile: $dockerfile_path)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "$multiarch_image" \
            --file "$dockerfile_path" \
            --provenance=false \
            --metadata-file "$metadata_dir/meta-multiarch-${scenario}.json" \
            "$context"
        done

        for scenario in "${scenarios[@]}"; do
          image=$(jq -r --arg service "$scenario" '.services[$service].image // empty' "$compose_json")
          case "$image" in
            */krkn-hub:*) multiarch_image="${image/krkn-hub:/krkn-hub-multiarch:}" ;;
            *) continue ;;
          esac
          digest=$(jq -r '.["containerimage.digest"] // empty' "$metadata_dir/meta-multiarch-${scenario}.json")
          if [[ -z "$digest" ]]; then
            echo "::error::Missing multi-arch build digest for $scenario; cannot sign"
            exit 1
          fi
          ref="${multiarch_image%:*}@${digest}"
          echo "Signing $ref"
          cosign sign --yes --signing-config "${{ github.workspace }}/.github/cosign/signing-config.json" --key env://COSIGN_PRIVATE_KEY "$ref"
          cosign verify --insecure-ignore-tlog=true --key "$RUNNER_TEMP/cosign.pub" "$ref"
        done

    - name: Make push to Prow-Scripts
      uses: redhat-chaos/actions/prow-scripts@main
      with:
        AUTOPUSH: ${{ inputs.AUTOPUSH }}
